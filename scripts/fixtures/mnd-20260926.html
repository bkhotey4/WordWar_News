            <p>中共解放軍臺海周邊海、空域動態</p>

<p><br>
一、日期 ：</p>

<p>中華民國115年9月25日（星期五）0600時至115年9月26日（星期六）0600時止。</p>

<p><br>
二、活動動態 ：</p>

<p>迄0600時止，偵獲共機5架次（逾越中線進入北部空域共1架）、共艦6艘及公務船5艘，持續在臺海周邊活動。國軍運用任務機、艦及岸置飛彈系統嚴密監控與應處。&nbsp;</p>
